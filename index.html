<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Benteng Pecahan - Edisi Spesial Kelas 6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- MENU UTAMA -->
    <div id="main-menu" class="screen-overlay">
        <h1 class="game-title" style="font-size: 4.5rem; margin-bottom: 10px;">🏰 Benteng Pecahan</h1>
        <p style="color: #4ecca3; font-size: 1.5rem; margin-bottom: 40px; font-weight: bold;">Taklukkan Pecahan, Lindungi Benteng!</p>
        
        <input type="text" id="team-name-input" placeholder="Masukkan Nama Tim (Max 15 Huruf)" maxlength="15">
        
        <div style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;">
            <button class="menu-btn btn-primary" onclick="startGame()">▶ MULAI BERMAIN</button>
            <button class="menu-btn btn-secondary" onclick="showGallery()">📖 ENSIKLOPEDIA</button>
            <button class="menu-btn btn-tertiary" onclick="showHoF()">🏆 Peringkat</button>
        </div>
    </div>

    <!-- GALERI ENSIKLOPEDIA -->
    <div id="gallery-screen" class="screen-overlay hidden">
        <h1 class="game-title">📖 Ensiklopedia Game</h1>
        <div class="gallery-container">
            <div class="gallery-section">
                <h2 style="color: #f9d342; margin-bottom: 15px; border-bottom: 2px solid #f9d342; padding-bottom: 5px;">Katalog Menara</h2>
                <div id="tower-gallery-list" class="gallery-grid"></div>
            </div>
            <div class="gallery-section">
                <h2 style="color: #e94560; margin-bottom: 15px; border-bottom: 2px solid #e94560; padding-bottom: 5px;">Database Monster</h2>
                <div id="enemy-gallery-list" class="gallery-grid"></div>
            </div>
        </div>
        <button class="menu-btn btn-secondary" onclick="hideGallery()" style="margin-top: 20px;">Kembali ke Menu</button>
    </div>

    <!-- Papan Peringkat (Hall of Fame) -->
    <div id="hof-screen" class="screen-overlay hidden">
        <h1 class="game-title">🏆 Hall of Fame</h1>
        <h2 id="final-score-text" class="hidden" style="color: #4ecca3; margin-bottom: 20px;">Skor Akhir Tim: 0</h2>
        <div id="leaderboard-list" class="instructions" style="width: 400px; font-size:1.2rem;"></div>
        
        <div id="hof-gameover-controls" class="hidden" style="margin-top: 20px;">
            <button class="menu-btn btn-primary" onclick="playAgain()">MAIN LAGI (Tim Sama)</button>
            <button class="menu-btn btn-secondary" onclick="location.reload()">MENU UTAMA</button>
        </div>
        <button id="hof-close-btn" class="menu-btn btn-secondary" onclick="hideHoF()" style="margin-top: 20px;">Tutup</button>
    </div>

    <!-- UI GAME UTAMA -->
    <div id="game-container" class="hidden">
        
        <!-- POPUP WAVE BARU (SMOOTH SLIDE) -->
        <div id="wave-popup" class="popup-hidden">
            <h2 id="announce-title">Wave Selesai!</h2>
            <p id="announce-desc">Persiapkan dirimu...</p>
        </div>

        <div id="top-bar">
            <div class="stat-box">HP: <span id="base-hp" class="highlight-text">10</span> ❤️</div>
            <div id="wave-display" class="wave-text">Lvl 1 - Wave 1</div>
            <div class="stat-box desktop-only">Skor: <span id="score-display" class="highlight-text" style="color:#4ecca3;">0</span> 🏆</div>
            <div class="stat-box desktop-only">Tim: <span id="team-display" style="color:#fff;">-</span></div>
            <div class="stat-box">Energi: <span id="energy-display" class="highlight-text">0</span> ⭐</div>
        </div>

        <div id="message-area" class="message-banner">Pilih jawaban yang tepat!</div>

        <div id="middle-section">
            <div id="canvas-container"><canvas id="gameCanvas"></canvas></div>

            <div id="shop-panel">
                <h3 class="shop-title">Gudang Senjata</h3>
                <div id="shop-buttons-container"></div>
            </div>
        </div>

        <div id="quiz-panel">
            <div id="question-text">Memuat soal...</div>
            <div id="quiz-options">
                <button class="quiz-btn" onclick="checkAnswer(this)"></button>
                <button class="quiz-btn" onclick="checkAnswer(this)"></button>
                <button class="quiz-btn" onclick="checkAnswer(this)"></button>
            </div>
        </div>
    </div>

    <script src="questions.js"></script>
    <script src="enemies.js"></script>
    <script src="towers.js"></script>
    <script src="app.js"></script>
</body>
</html>
